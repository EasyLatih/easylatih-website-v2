<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password | EasyLatih Trainer Portal</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
<header class="portal-topbar">
  <div class="portal-topbar-inner">
    <a href="index.html" class="portal-brand"><img src="../assets/logo.png" alt="EasyLatih"><div>Trainer Portal<small>Password Recovery</small></div></a>
  </div>
</header>
<main class="page" style="max-width:620px">
  <div class="form-card">
    <h2>Forgot your password?</h2>
    <p class="muted">Enter the email address registered with EasyLatih. We will send you a secure link to choose a new password.</p>
    <div id="forgotMessage" class="hidden"></div>
    <form id="forgotPasswordForm">
      <div class="field">
        <label for="recovery_email">Email</label>
        <input id="recovery_email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="btn-row">
        <button id="sendRecoveryButton" class="btn btn-primary" type="submit">Send Reset Link</button>
        <a class="btn btn-outline" href="index.html?login=1">Back to Login</a>
      </div>
    </form>
    <div class="alert alert-info">For security, the page will show the same confirmation whether or not an account exists for the email entered.</div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script src="config.js"></script>
<script src="password-recovery.js"></script>
<script>EasyLatihPasswordRecovery.initForgotPassword();</script>
</body>
</html>
