<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Set New Password | EasyLatih Trainer Portal</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
<header class="portal-topbar">
  <div class="portal-topbar-inner">
    <a href="index.html" class="portal-brand"><img src="../assets/logo.png" alt="EasyLatih"><div>Trainer Portal<small>Set New Password</small></div></a>
  </div>
</header>
<main class="page" style="max-width:620px">
  <div class="form-card">
    <h2>Choose a new password</h2>
    <p class="muted">Open this page using the password recovery link sent to your email, then set a new password below.</p>
    <div id="resetMessage" class="alert alert-info">Checking your recovery link…</div>
    <form id="resetPasswordForm" class="hidden">
      <div class="field">
        <label for="new_password">New Password</label>
        <input id="new_password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <span class="help">Minimum 8 characters.</span>
      </div>
      <div class="field" style="margin-top:.8rem">
        <label for="confirm_password">Confirm New Password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="btn-row">
        <button id="updatePasswordButton" class="btn btn-primary" type="submit">Update Password</button>
      </div>
    </form>
    <div style="margin-top:1rem"><a href="index.html?login=1" style="color:#0d3b66;font-weight:600">Back to Login</a></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script src="config.js"></script>
<script src="password-recovery.js"></script>
<script>EasyLatihPasswordRecovery.initResetPassword();</script>
</body>
</html>
